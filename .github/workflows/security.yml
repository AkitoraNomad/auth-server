name: Security regression

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race ./...
      - run: go vet ./...
      - name: Isolated security regression using locked dependencies
        run: GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" python3 test/securityaudit/run.py
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: auth-server-webui
      - run: pnpm lint && pnpm build && pnpm audit --audit-level=moderate
        working-directory: auth-server-webui
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: auth-server-webui
      - run: python -m pip install -r test/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Live PostgreSQL/Redis and browser regression
        env:
          AUTH_TEST_POSTGRES: postgres://postgres:regression@localhost:5432/postgres?sslmode=disable
          AUTH_TEST_REDIS: localhost:6379
          AUTH_TEST_BROWSER_PYTHON: python
          GIN_MODE: release
        run: go test -tags integration -race -count=1 -v ./internal/http -run TestLive
